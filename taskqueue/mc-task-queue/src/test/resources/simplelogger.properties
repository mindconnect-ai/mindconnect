# Test logging: the turn's story — LLM calls, tool calls, task lifecycle.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showShortLogName=true

org.slf4j.simpleLogger.log.ai.mindconnect.agent.llm.calls=debug
org.slf4j.simpleLogger.log.ai.mindconnect.agent.tool.calls=debug
org.slf4j.simpleLogger.log.ai.mindconnect.agent.core=debug
org.slf4j.simpleLogger.log.ai.mindconnect.taskqueue.tasks=debug

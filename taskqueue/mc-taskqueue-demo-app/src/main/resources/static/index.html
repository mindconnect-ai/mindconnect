<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Queue Demo</title>
  <link rel="stylesheet" href="/sui/sui.css">
  <link rel="stylesheet" href="/taskqueue-demo.css">
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--sui-color-bg, #f5f5f5); }
    #app { max-width: 1100px; margin: 0 auto; padding: 16px; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import { SuiRenderer, installDefaultHandlers } from "/sui/renderer.js";
    import { SuiEventBus } from "/sui/eventbus.js";
    import { install as installJsonViewer } from "/sui-ext/jsonviewer/extension.js";

    const host = document.getElementById("app");
    const renderer = installDefaultHandlers(new SuiRenderer().attach(host));
    await installJsonViewer(renderer);

    const bus = new SuiEventBus(renderer, host);

    // Boot from the URL in the address bar so deep links like /tasks/{id} are
    // bookmarkable and survive a reload. start() also wires popstate.
    const path = window.location.pathname + window.location.search;
    bus.start(path === "/" ? "/tasks" : path);
  </script>
</body>
</html>

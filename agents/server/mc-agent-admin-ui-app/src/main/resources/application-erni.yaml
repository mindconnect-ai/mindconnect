# ── ERNI AI ──────────────────────────────────────────────────────────────────
# A worked example of mindconnect.branding: the same app under a different
# name, mark and palette, with nothing built in. Run it with
# --spring.profiles.active=erni (or -Dspring-boot.run.profiles=erni).
#
# The assets come from ./branding/erni next to this app; the palette is the
# "erni" theme in mc-agent-admin-ui-rest. See that directory's README,
# including the note that the logos in it are drawn for the example rather
# than the official assets.
#
# This profile and the theme live on feature/branding-erni, not on the branch
# that adds mindconnect.branding: the mechanism belongs in the product, a
# named brand does not.
mindconnect:
  branding:
    title: ERNI AI
    logo: /branding/logo.svg
    favicon: /branding/favicon.svg
    # The palette is a theme now (static/css/erni.css in mc-agent-admin-ui-rest),
    # so the branding sheet below is left with what a theme cannot reach: the
    # login page, which carries no app shell and therefore no theme class.
    theme: erni
    stylesheets:
      - /branding/erni.css
    assets-dir: ${MC_BRANDING_ASSETS_DIR:./branding/erni}

server:
  port: 9090
  tomcat:
    # How much of a rejected upload Tomcat still reads before answering.
    # Below the request limit the browser sees the "upload too large" toast;
    # a bigger body has its connection closed and shows as a network error.
    max-swallow-size: ${MC_UPLOAD_MAX_REQUEST_SIZE:100MB}

logging:
  pattern:
    console: "%d{HH:mm:ss} %-5level [%X{agentName:-}/%X{subAgent:-}] [%logger{36}] %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [s=%X{sessionId:-} a=%X{agentName:-} sub=%X{subAgent:-} tool=%X{tool:-}] %logger{50} - %msg%n"
  file:
    name: logs/agent-admin-ui.log
  logback:
    rollingpolicy:
      file-name-pattern: logs/agent-admin-ui.%d{yyyy-MM-dd}.%i.log
      max-history: 7
      total-size-cap: 200MB
  level:
    root: WARN
    ai.mindconnect: INFO
    ai.mindconnect.llm.wire: INFO
    ai.mindconnect.agent.tool: DEBUG
    org.springframework: INFO
    org.springframework.security: DEBUG
    org.springframework.security.oauth2.client: TRACE
    org.springframework.security.web.authentication: TRACE

mindconnect:
  # Where everything is stored: "file" under data.base-dir (default), or
  # "postgres" — every repository in the database, tables created on start.
  persistence: ${MC_PERSISTENCE:file}
  # The namespace this process runs in: file data under data.base-dir/<namespace>,
  # a namespace key column in Postgres. One process serves one namespace.
  namespace: ${MC_NAMESPACE:local}
  postgres:
    url: ${MC_POSTGRES_URL:jdbc:postgresql://localhost:5432/mindconnect}
    username: ${MC_POSTGRES_USER:}
    password: ${MC_POSTGRES_PASSWORD:}
  data:
    base-dir: ./data
  # Authentication is OFF by default so the app runs without Keycloak. In that
  # mode SecurityConfig wires an "everything permitAll" chain and injects a
  # fixed dev user (see dev-user) as the OidcUser principal.
  # To require Keycloak login, activate the "keycloak" profile
  # (--spring.profiles.active=keycloak): it provides the OAuth2 client
  # registration AND flips auth.enabled on together.
  auth:
    enabled: ${MC_AUTH_ENABLED:false}
    # Username used as the OidcUser when auth is disabled.
    dev-user: ${MC_DEV_USER:mc_user}
  tools:
    tavily-api-key: ${TAVILY_API_KEY:}
    # The admin app on your own machine is a one-user app: a session may work
    # anywhere under your home. On a server set MC_WORKING_DIR_ROOT to the
    # users' tree — /srv/mindconnect/home/{user} — so nobody leaves their own.
    working-dir-root: ${MC_WORKING_DIR_ROOT:${user.home}}
  mcp:
    # MCP servers this installation starts itself. A "process" target runs a
    # command, a "docker" target a container — both with the rights of this
    # server, and /mcp-gateway asks for a login, not an admin role. Unset,
    # each follows sign-in: on while auth.enabled is false, off once it is
    # true. Set explicitly with MINDCONNECT_MCP_ALLOW_PROCESS / _ALLOW_DOCKER.
    # allow-process: false
    # allow-docker: false
    # Suggestions for registering MCP servers, fetched from Docker's public
    # catalog. Off by default: it is an outbound call to a third party, and
    # an installation that does not want one should not make it because
    # somebody opened a screen. Registering by hand works without it.
    catalog:
      enabled: ${MC_MCP_CATALOG_ENABLED:false}
  # How this installation names and dresses itself. Every value is optional;
  # unset, the app looks exactly as it ships. Asset URLs are used verbatim, so
  # a path into the app's own static resources (/img/logo.svg), one into
  # assets-dir below (/branding/logo.svg) and an absolute URL all work.
  branding:
    # The heading in the header, the login page's title, and the browser tab
    # unless document-title says otherwise.
    title: ${MC_BRANDING_TITLE:Mindconnect Agent Runtime}
    # document-title: ACME Assistants
    # The mark beside the heading. Empty means none — a header with the
    # wordmark alone.
    logo: ${MC_BRANDING_LOGO:/img/logo.svg}
    # Where a click on the brand leads.
    # logo-href: /admin/agents
    # The browser tab's icon; unset it follows the logo.
    # favicon: /branding/favicon.png
    # The look the shell opens in: amethyst (default), clody, gipiti, sorbet,
    # erni, compact, dark, or "default" for the framework's bare one. The
    # theme picker in the header still overrides it per browser.
    # theme: amethyst
    # Stylesheets linked after every shipped one, so their rules win. Either
    # bundled with the app, dropped into assets-dir, or on a server elsewhere.
    # stylesheets:
    #   - /branding/acme.css
    #   - https://cdn.example.com/acme.css
    # A directory on disk served at /branding/** — brand a deployed app by
    # dropping files next to it, no rebuild.
    assets-dir: ${MC_BRANDING_ASSETS_DIR:}
  encryption:
    # Required — encrypts stored LLM credentials. No default on purpose.
    # Set MINDCONNECT_ENCRYPTION_SECRET_KEY to a strong, private 32-char value.
    secret-key: ${MINDCONNECT_ENCRYPTION_SECRET_KEY:}

spring:
  web:
    resources:
      static-locations: classpath:/static/
  servlet:
    multipart:
      # Chat and vector-store uploads. Spring's defaults (1MB per file, 10MB
      # per request) answer a phone photo, or three of them, with HTTP 413.
      # The runtime sends a file inline to the model up to 20MB.
      max-file-size: ${MC_UPLOAD_MAX_FILE_SIZE:25MB}
      max-request-size: ${MC_UPLOAD_MAX_REQUEST_SIZE:100MB}

springdoc:
  # The admin shell's API section embeds this Swagger UI. Scope it to the
  # runtime's REST API — the admin-ui page controllers return recursive
  # UiNode trees whose schemas freeze Swagger UI's example renderer.
  # The agent API and the OpenAI Responses API; the UI endpoints stay out.
  paths-to-match: /api/**, /v1/**
  swagger-ui:
    # Operations start collapsed; the standalone Schemas section is hidden
    # (belt and braces against expensive model rendering).
    docExpansion: none
    defaultModelsExpandDepth: -1

---
# ── Keycloak / OIDC login ────────────────────────────────────────────────────
# Only active with the "keycloak" profile (--spring.profiles.active=keycloak).
# Without it there is no OAuth2 client registration, so Spring's OAuth2 client
# auto-config backs off and the app starts fully without Keycloak (open chain).
spring:
  config:
    activate:
      on-profile: keycloak
  # OAuth2 client (BFF). The "keycloak" registration is referenced by
  # SecurityConfig and Spring Security's /oauth2/authorization/{registrationId}.
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: ${KC_ISSUER_URI:http://localhost:8180/realms/mindconnect}
        registration:
          keycloak:
            client-id: ${KC_CLIENT_ID:mc-admin-ui}
            client-secret: ${KC_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            scope: openid, profile, email
            # Must match the Valid redirect URI registered in Keycloak.
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
mindconnect:
  # Turn auth on together with the registration above, so securedFilterChain
  # always has its ClientRegistrationRepository.
  auth:
    enabled: true
    # Bearer JWTs for /api/** and /v1/** are checked against the same realm the
    # browser logs in with. MC_JWT_AUDIENCES, when set, additionally requires
    # one of the listed audiences (needs an audience mapper in Keycloak).
    jwt:
      issuer-uri: ${KC_ISSUER_URI:http://localhost:8180/realms/mindconnect}
      audiences: ${MC_JWT_AUDIENCES:}

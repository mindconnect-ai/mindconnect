<?xml version="1.0" encoding="UTF-8"?>
<!--
  PLACEHOLDER — not the official ERNI asset.

  A stand-in wordmark so this branding example runs out of the box. Replace
  this file with the official logo from the ERNI brand portal; nothing else
  has to change, the file name is what application-erni.yaml points at.

  The header renders it at 36px height and, on a dark band, paints it white
  (see the sui-header-logo-filter token), so the colour below only shows
  where a sheet turns that filter off.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 134 56" width="134" height="56"
     role="img" aria-label="ERNI">
  <text x="0" y="42" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="44" font-weight="700" letter-spacing="2" fill="#0A192C">ERNI</text>
</svg>

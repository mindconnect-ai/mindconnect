<!DOCTYPE html>
<html lang="en" data-default-theme="amethyst">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mindconnect Agent Runtime</title>
    <link rel="stylesheet" href="/sui/sui.css">
    <link rel="stylesheet" href="/css/app.css">
    <!-- Themes. Each is an overlay scoped to its own class on <html>, so an
         inactive one costs bytes and nothing else. The script below picks
         which class is set; with none, the app renders as the framework
         default. Both must stay ahead of chat-ui.css, whose chat rules are
         meant to win over the generic ones. -->
    <link rel="stylesheet" href="/css/clody.css">
    <link rel="stylesheet" href="/css/gipiti.css">
    <link rel="stylesheet" href="/css/sorbet.css">
    <link rel="stylesheet" href="/css/compact.css">
    <!-- Dark is the framework's own theme (html.sui-theme-dark), shipped in
         mc-semantic-ui-core; there is no reason to write a second one. -->
    <link rel="stylesheet" href="/sui/sui-dark.css">
    <link rel="stylesheet" href="/css/amethyst.css">
    <script>
        /*
         * Theme selection, before first paint.
         *
         * Inline and in <head> on purpose: as a separate file this would run
         * after the first paint and the page would flash the previous theme.
         * It deliberately knows no theme names — it applies whatever was
         * remembered (or asked for in ?theme=), and js/theme-switch.js owns
         * the list of what is real. A stale or invented name simply matches
         * no stylesheet and the app renders as the framework default.
         */
        (function () {
            var root = document.documentElement;
            // A host whose picker is off does not let the look be chosen at
            // all — not through the menu, not through ?theme=, and not
            // through what this browser remembers from before it was turned
            // off. See mindconnect.branding.style-picker.
            var fixed = root.dataset.themePicker === "off";
            var url = new URL(window.location.href);
            var wanted = fixed ? null : url.searchParams.get("theme");
            if (wanted) {
                try { localStorage.setItem("sui-theme", wanted); } catch (e) { /* private mode */ }
            }
            var active = wanted;
            if (!active && !fixed) {
                try { active = localStorage.getItem("sui-theme"); } catch (e) { active = null; }
            }
            // The installation's default look: mindconnect.branding.theme is
            // written into data-default-theme when the shell is served (see
            // BrandingShellController), so a branded install opens in its own
            // theme while the picker still wins per browser.
            if (!active) active = root.dataset.defaultTheme || "amethyst";
            if (/^[a-z][a-z0-9-]*$/.test(active) && active !== "default") {
                root.classList.add("sui-theme-" + active);
            }
        })();
    </script>
    <script>
        /*
         * The browser's time zone, for the server: the first time it sees it
         * for a user without one, it becomes theirs — what their agents read
         * "16:16" in (UserRecordingFilter). A cookie rather than a header, so
         * every request carries it, the renderer's own fetches included; the
         * user changes it on the profile page, and this never overrides that.
         */
        (function () {
            try {
                var zone = Intl.DateTimeFormat().resolvedOptions().timeZone;
                if (zone) {
                    document.cookie = "mc-time-zone=" + encodeURIComponent(zone)
                        + "; path=/; max-age=31536000; SameSite=Lax";
                }
            } catch (e) { /* no Intl, or cookies off: the installation's zone applies */ }
        })();
    </script>
    <!-- Chat shell (sidebar + conversation) — ships with mc-agent-chat-ui-rest. -->
    <link rel="stylesheet" href="/css/chat-ui.css">
    <!-- Embedded workflow admin (/workflow-admin): step cards and workflow
         domain colours. The base <sui-diagram> styling comes with the diagram
         extension through the asset registry (see /sui/assets.js). -->
    <link rel="stylesheet" href="/css/workflow-admin.css">
    <link rel="stylesheet" href="/sui-ext/workflow/workflow-diagram.css">
</head>
<body>
    <!-- The header (brand, nav, user widget) is part of the server-rendered
         UiNode tree now (see AdminLayout / AdminLayoutAdvice), so the shell is
         just the renderer mount point. The loading overlay is drawn by the
         renderer itself (see /sui/renderer.js → defaultLoadingIndicator). -->
    <div id="main">
        <p>Loading…</p>
    </div>
    <!-- Markdown rendering (marked) and the andypf-json-viewer web component
         are now loaded lazily on demand by their mc-semantic-ui-extensions
         handlers (see app.js). No CDN script tags needed here. -->
    <script type="module" src="/js/app.js"></script>
    <!-- Chat: two-state history toggle — ships with mc-agent-chat-ui-rest. -->
    <script src="/js/chat-ui.js" defer></script>
    <!-- The theme picker in the header. Purely client-side: it swaps a class
         on <html> and remembers the choice per browser. -->
    <script src="/js/theme-switch.js" defer></script>
    <!-- Turns the agent form's icon field into a searchable grid of the
         framework's Lucide sprite. The field stays the source of truth. -->
    <script src="/js/icon-picker.js" defer></script>
    <!-- "New group" next to the agent form's group select: the rubrics come
         from the agents themselves, so naming a new one needs a field. -->
    <script src="/js/group-picker.js" defer></script>
    <!-- Logout leaves the SPA for Keycloak, so it must be a real navigation
         and not a routed fetch. See the file for what goes wrong otherwise. -->
    <script src="/js/logout.js" defer></script>
    <!-- Hands the active theme's colours to the json-viewer web component,
         which paints from a palette inside its own shadow root and so cannot
         be reached from app.css. -->
    <script src="/js/json-viewer-theme.js" defer></script>
</body>
</html>

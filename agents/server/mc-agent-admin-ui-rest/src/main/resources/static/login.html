<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — Mindconnect Agent Runtime</title>
    <style>
        /* The colours are framework tokens with the shipped value as the
           fallback: undefined they render exactly as before, and a branding
           stylesheet (mindconnect.branding.stylesheets) that sets the tokens
           reaches this page too — it has no app shell to inherit from. */
        :root {
            color-scheme: light dark;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--sui-color-bg, #f5f6f8);
            color: var(--sui-color-text, #1a1a1a);
        }
        .card {
            background: var(--sui-color-surface, #fff);
            padding: 40px 48px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            max-width: 380px;
            width: 90%;
            text-align: center;
        }
        h1 {
            margin: 0 0 8px;
            font-size: 22px;
            font-weight: 600;
        }
        p {
            margin: 0 0 24px;
            color: var(--sui-color-text-muted, #6b7280);
            font-size: 14px;
            line-height: 1.5;
        }
        .btn {
            display: inline-block;
            padding: 12px 28px;
            background: var(--sui-color-action, #2563eb);
            color: var(--sui-color-on-action, #fff);
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            transition: background 0.15s ease;
        }
        .btn:hover { background: var(--sui-color-action-hover, #1d4ed8); }
        .error {
            margin: 0 0 20px;
            padding: 12px 14px;
            background: var(--sui-color-danger-bg, #fef2f2);
            color: var(--sui-color-danger, #991b1b);
            border: 1px solid var(--sui-color-danger-border, #fecaca);
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
            text-align: left;
        }
        @media (prefers-color-scheme: dark) {
            body { background: var(--sui-color-bg, #111827); color: var(--sui-color-text, #f3f4f6); }
            .card { background: var(--sui-color-surface, #1f2937); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4); }
            p { color: var(--sui-color-text-muted, #9ca3af); }
            .error {
                background: var(--sui-color-danger-bg, #3f1d1d);
                color: var(--sui-color-danger, #fecaca);
                border-color: var(--sui-color-danger-border, #7f1d1d);
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1 id="brand-title">Mindconnect Agent Runtime</h1>
        <p>Sign in with your Keycloak account to continue.</p>
        <!--
          Filled in by the inline script below from the ?error= query
          parameter. Spring's failureUrl points at /login?error=…, so
          this is how the user finds out what went wrong without
          server-side templating.
        -->
        <div id="error" class="error" hidden></div>
        <a class="btn" href="/oauth2/authorization/keycloak">Sign in with Keycloak</a>
    </div>
    <script>
        // Display a human-readable reason when Spring's OAuth failure
        // handler bounces the user back here with ?error=…
        (function () {
            const params = new URLSearchParams(window.location.search);
            const code = params.get("error");
            if (!code) return;
            const el = document.getElementById("error");
            const messages = {
                oidc: "Your previous sign-in attempt failed. This usually means a stale session or an expired token — please try again."
            };
            el.textContent = "Login failed: " + (messages[code] || code);
            el.hidden = false;
        })();
    </script>
</body>
</html>

spring:
  application:
    name: mc-agent-api-app

server:
  port: 8080

mindconnect:
  # Where everything is stored: "file" under data.base-dir (default), or
  # "postgres" — every repository in the database, tables created on start.
  persistence: ${MC_PERSISTENCE:file}
  postgres:
    url: ${MC_POSTGRES_URL:jdbc:postgresql://localhost:5432/mindconnect}
    username: ${MC_POSTGRES_USER:}
    password: ${MC_POSTGRES_PASSWORD:}
  agent:
    storage-dir: data/agents
  workspace:
    base-dir: data/workspaces
  tools:
    # Tavily API key for web_search tool (leave empty to disable)
    tavily-api-key: ${TAVILY_API_KEY:}
    # Working directory for bash, file_list, file_read, file_write (defaults to user home)
    base-dir: ${user.home}
  eventbus:
    # Set to remote event bus URL to use SSE mode, leave empty for in-memory
    url: http://localhost:8081
  message:
    storage-dir: data/messages
  memory:
    storage-dir: data/memory

springdoc:
  # Scope the OpenAPI document to the REST API. The workflow admin's page
  # controller comes in with mc-workflow-admin-rest and maps 40 /workflow-admin
  # routes that return recursive UiNode trees — server-rendered UI, not API,
  # and schemas that freeze Swagger UI's example renderer.
  paths-to-match: /api/**

logging:
  level:
    ai.mindconnect: INFO
    root: WARN
  pattern:
    console: "%d{HH:mm:ss} %-5level [%logger{36}] %msg%n"

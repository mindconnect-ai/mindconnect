spring:
  main:
    web-application-type: none
    banner-mode: off

mindconnect:
  # The namespace the local stores are bound to: data under <base-dir>/<namespace>.
  namespace: ${MC_NAMESPACE:local}
  user:
    id: mcuser
  agent:
    storage-dir: data/agents
    tool-result:
      summarizer: llm
  message:
    storage-dir: data/messages
  memory:
    storage-dir: data/memory
  workspace:
    base-dir: data/workspaces
  tools:
    tavily-api-key: ${TAVILY_API_KEY:}
    # Default base directory for bash, file_list, file_read, file_write when a
    # session has no working directory of its own (defaults to user home).
    base-dir: ${user.home}
    # A session's working directory — where the CLI was launched, or /cd — may
    # be anywhere: one user, their own machine. A server keeps this under
    # its tools base-dir.
    working-dir-root: /
  # Uncomment to use remote agent server
  # remote:
  #   url: http://localhost:8080

  logging:
    level:
      ai.mindconnect: INFO
      ai.mindconnect.message.adapter: WARN
      ai.mindconnect.agent.runtime.adapter.token: INFO

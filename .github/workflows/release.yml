name: release

# Manual, deliberate releases only — never on every merge. You pick the moment;
# this cuts the -SNAPSHOT to a real version, publishes every module to
# MAVEN CENTRAL (Central Publisher Portal), tags it, then opens the next
# -SNAPSHOT on main.
#
# Required secrets (org-level on mindconnect-ai, shared with mc-semantic-ui):
#   CENTRAL_TOKEN_USERNAME / CENTRAL_TOKEN_PASSWORD — a user token from
#     https://central.sonatype.com (Account → Generate User Token); the
#     namespace ai.mindconnect must be verified there once.
#   MAVEN_GPG_PRIVATE_KEY  — ASCII-armored private key for artifact signing
#     (gpg --armor --export-secret-keys <id>).
#   MAVEN_GPG_PASSPHRASE   — its passphrase.
#
# With autoPublish=false (mc-java-parent), the upload waits in the Portal
# for a manual "Publish" — nothing goes live by accident.
on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Release version (blank = drop -SNAPSHOT from the current one)'
        required: false
        default: ''
      nextVersion:
        description: 'Next dev version incl. -SNAPSHOT (blank = bump patch)'
        required: false
        default: ''
      allowEmptyChangelog:
        description: 'Release even though CHANGELOG.md has nothing under [Unreleased]'
        type: boolean
        required: false
        default: false

permissions:
  contents: write   # push the version-bump commits and the tag

# One release at a time. Two dispatches minutes apart once raced each other:
# the second still held the pre-release checkout, cut the OLD version, uploaded
# it to Central and only failed at the final push — after the upload. Queued,
# the second run sees the first one's result and the guard below stops it.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          # Writes ~/.m2/settings.xml with a server id matching the
          # publishingServerId in mc-java-parent, and imports the GPG key.
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Compute versions
        id: v
        run: |
          set -euo pipefail
          CURRENT=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          RELEASE="${{ inputs.releaseVersion }}"
          [ -z "$RELEASE" ] && RELEASE="${CURRENT%-SNAPSHOT}"
          NEXT="${{ inputs.nextVersion }}"
          if [ -z "$NEXT" ]; then
            IFS='.' read -r MA MI PA <<< "$RELEASE"
            NEXT="${MA}.${MI}.$((PA + 1))-SNAPSHOT"
          fi
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT"       >> "$GITHUB_OUTPUT"
          echo "Releasing $CURRENT -> $RELEASE, then opening $NEXT"

      # The checkout must be the branch's tip and the version must be new —
      # checked BEFORE the build, because a Central upload cannot be undone by
      # a failed push afterwards. A run queued behind another release fails
      # here, cleanly, with the reason.
      - name: Refuse a stale checkout or an existing version
        env:
          RELEASE: ${{ steps.v.outputs.release }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --quiet origin "$BRANCH"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$BRANCH")" ]; then
            echo "::error::$BRANCH moved since this run was queued (now $(git rev-parse --short "origin/$BRANCH"), run has $(git rev-parse --short HEAD)). Start the release again from the current tip."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$RELEASE" > /dev/null 2>&1; then
            echo "::error::v$RELEASE is already released (tag exists). Pick another version."
            exit 1
          fi

      # Flat version scheme — every module shares the exact same version string,
      # in both <version> and <parent>. versions:set misses the area-aggregator
      # poms (their parent isn't in that reactor), so replace the literal string
      # across every pom instead; it's complete and can't leave a mixed state.
      - name: Set release version
        run: sed -i "s|<revision>.*</revision>|<revision>${{ steps.v.outputs.release }}</revision>|; s|<changelist>.*</changelist>|<changelist></changelist>|" pom.xml mc-java-parent/pom.xml

      # Keep the copy-paste dependency snippets in the docs on the version people
      # can actually pull. Targets only a <version> that follows an mc-* artifactId,
      # so third-party versions (spring-boot, …) are untouched. Committed with the
      # release below. Docusaurus can't interpolate variables inside code fences,
      # so this source rewrite is the way. Shown without -SNAPSHOT; it stays until
      # the next release moves it.
      - name: Update dependency snippets in the docs
        env:
          RELEASE: ${{ steps.v.outputs.release }}
        run: >
          find website/docs \( -name '*.md' -o -name '*.mdx' \) -print0
          | xargs -0 perl -0777 -pi -e
          's|(<artifactId>mc-[^<]+</artifactId>\s*<version>)[^<]+(</version>)|${1}$ENV{RELEASE}${2}|g'

      # Before the upload, deliberately: an empty [Unreleased] means someone
      # forgot, and finding that out after a push to Central is too late —
      # a released version can never be taken back.
      - name: Freeze the changelog into this version
        env:
          RELEASE: ${{ steps.v.outputs.release }}
          ALLOW_EMPTY: ${{ inputs.allowEmptyChangelog }}
        run: |
          set -euo pipefail
          if ! grep -q '^## \[Unreleased\]' CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [Unreleased]' heading to release."
            exit 1
          fi
          # Everything between [Unreleased] and the next version heading.
          BODY=$(awk '/^## \[Unreleased\]/{f=1;next} /^## \[/{f=0} f' CHANGELOG.md)
          if [ -z "$(echo "$BODY" | tr -d '[:space:]')" ] && [ "$ALLOW_EMPTY" != "true" ]; then
            echo "::error::[Unreleased] is empty. Write what changed, or re-run with allowEmptyChangelog."
            exit 1
          fi
          printf '%s\n' "$BODY" > /tmp/release-notes.md
          sed -i "s|^## \[Unreleased\]$|## [$RELEASE] - $(date -u +%Y-%m-%d)|" CHANGELOG.md

      # The `release` profile (mc-java-parent) attaches sources + javadoc,
      # signs with GPG and hands the deploy to the central-publishing plugin.
      # Last look before the point of no return: a merge that landed during
      # the build makes this run's commit unpushable, so stop here, not after
      # the upload.
      - name: Refuse to upload if the branch moved during the build
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --quiet origin "$BRANCH"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$BRANCH")" ]; then
            echo "::error::$BRANCH moved during the build. Nothing was uploaded; start the release again."
            exit 1
          fi

      - name: Build & publish to Maven Central
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn -B -ntp -DskipTests -Prelease deploy

      - name: Commit release version and tag
        run: |
          git commit -am "release: v${{ steps.v.outputs.release }}"
          git tag -a "v${{ steps.v.outputs.release }}" -m "Release v${{ steps.v.outputs.release }}"

      - name: Open next development version
        run: sed -i "s|<revision>.*</revision>|<revision>${NEXT%-SNAPSHOT}</revision>|; s|<changelist>.*</changelist>|<changelist>-SNAPSHOT</changelist>|" pom.xml mc-java-parent/pom.xml
        env:
          NEXT: ${{ steps.v.outputs.next }}

      # In the same commit as the version bump, so main always has somewhere to
      # write the next entry — the moment it does not, people stop writing them.
      - name: Open a fresh Unreleased section
        env:
          RELEASE: ${{ steps.v.outputs.release }}
        run: |
          set -euo pipefail
          # index(), not a regex match: the heading contains [0.0.3], which as a
          # pattern is a character class and would never match the line it came
          # from — silently leaving main with nowhere to write the next entry.
          awk -v rel="## [$RELEASE]" '
            index($0, rel) == 1 && !done { print "## [Unreleased]"; print ""; done = 1 }
            { print }
          ' CHANGELOG.md > /tmp/changelog.md && mv /tmp/changelog.md CHANGELOG.md
          grep -q '^## \[Unreleased\]' CHANGELOG.md \
            || { echo "::error::failed to reopen [Unreleased]"; exit 1; }

      - name: Commit next version and push
        env:
          RELEASE: ${{ steps.v.outputs.release }}
        run: |
          set -euo pipefail
          git commit -am "chore: start ${{ steps.v.outputs.next }} [skip ci]"
          if ! git push origin HEAD:${{ github.ref_name }} --follow-tags; then
            echo "::error::Push rejected after the Central upload. v$RELEASE is NOT tagged or released; drop its deployment in the Central Portal (https://central.sonatype.com/publishing/deployments) before releasing again."
            exit 1
          fi

      # The changelog entry is the release note. Two sources would drift, and
      # the hand-written one is the one aimed at a reader deciding whether to
      # upgrade; --generate-notes is appended under it for the commit detail.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "v${{ steps.v.outputs.release }}"
          --title "v${{ steps.v.outputs.release }}"
          --notes-file /tmp/release-notes.md
          --generate-notes

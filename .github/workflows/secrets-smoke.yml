# Temporary: verifies the org-level Maven-Central secrets work (no publishing).
# Delete after the first successful run.
name: secrets-smoke

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: GPG key + passphrase
        env:
          KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          PASS: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          set -e
          [ -n "$KEY" ]  || { echo "::error::MAVEN_GPG_PRIVATE_KEY is empty"; exit 1; }
          [ -n "$PASS" ] || { echo "::error::MAVEN_GPG_PASSPHRASE is empty"; exit 1; }
          printf '%s' "$KEY" | gpg --batch --import
          echo smoke | gpg --batch --pinentry-mode loopback --passphrase "$PASS" --clearsign > /dev/null
          echo "OK: private key imports and signs with the passphrase"

      - name: Central Portal token
        env:
          U: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          P: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: |
          set -e
          [ -n "$U" ] || { echo "::error::CENTRAL_TOKEN_USERNAME is empty"; exit 1; }
          [ -n "$P" ] || { echo "::error::CENTRAL_TOKEN_PASSWORD is empty"; exit 1; }
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $(printf '%s:%s' "$U" "$P" | base64 -w0)" \
            "https://central.sonatype.com/api/v1/publisher/published?namespace=ai.mindconnect&name=probe&version=0.0.0")
          echo "Central API answered HTTP $code"
          [ "$code" = "200" ] || { echo "::error::Central token rejected (HTTP $code)"; exit 1; }
          echo "OK: Central Portal accepts the token"

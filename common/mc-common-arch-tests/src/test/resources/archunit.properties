# Frozen rules: today's violations are recorded here and tolerated; a new one fails.
# The store may only shrink. Refresh it deliberately in a ratchet step with
#   mvn test -Darchunit.freeze.store.default.allowStoreUpdate=true
freeze.store.default.path=archunit_store
freeze.store.default.allowStoreCreation=true
freeze.store.default.allowStoreUpdate=false
freeze.refreeze=false
# An area without, say, adapter packages has nothing for some rules to check; that is not a failure.
archRule.failOnEmptyShould=false
